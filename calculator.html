<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root {
  --bg:       #0c0c0c;
  --btn:      #111111;
  --btn-op:   #161616;
  --btn-fn:   #0e0e0e;
  --btn-util: #131313;
  --btn-eq:   #f2f2f2;
  --eq-txt:   #0c0c0c;
  --line:     rgba(255,255,255,.065);
  --line2:    rgba(255,255,255,.12);
  --t1:       #f2f2f2;
  --t2:       rgba(242,242,242,.5);
  --t3:       rgba(242,242,242,.25);
  --t4:       rgba(242,242,242,.1);
  --err:      #e05555;
  --ff:       'Instrument Sans', sans-serif;
  --fm:       'JetBrains Mono', monospace;
}
.lm {
  --bg:#eaeae8; --btn:#e2e2e0; --btn-op:#d8d8d6; --btn-fn:#e6e6e4;
  --btn-util:#dcdcda; --btn-eq:#111; --eq-txt:#f2f2f2;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.14);
  --t1:#111; --t2:rgba(17,17,17,.5); --t3:rgba(17,17,17,.28); --t4:rgba(17,17,17,.1);
  --err:#c02020;
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:var(--bg);color:var(--t1);
  font-family:var(--ff);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:background .25s ease,color .25s ease;
}

/* ═══════════════════════════════════════
   APP SHELL — fills full screen
═══════════════════════════════════════ */
#app{
  display:flex;
  flex-direction:column;
  width:100vw;
  height:100dvh;
  min-height:0;
}

/* ═══════════════════════════════════════
   TOP BAR
═══════════════════════════════════════ */
.bar{
  display:flex;align-items:center;gap:10px;
  padding:0 16px;
  height:46px;
  flex-shrink:0;
  border-bottom:1px solid var(--line);
}
.bar-brand{
  font-size:11px;font-weight:700;letter-spacing:.28em;
  color:var(--t3);text-transform:uppercase;
}
.bar-space{flex:1;}

/* Angle pill */
.angle-pill{
  display:flex;
  background:var(--t4);
  border-radius:20px;
  padding:2px;
  gap:1px;
}
.apill-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--ff);font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--t3);padding:4px 10px;border-radius:16px;
  transition:background .12s,color .12s;text-transform:uppercase;
}
.apill-btn.on{background:var(--btn-op);color:var(--t1);}

/* Icon buttons */
.ib{
  width:32px;height:32px;border-radius:7px;
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);transition:background .12s,color .12s;
}
.ib:hover{background:var(--line);color:var(--t1);}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

/* ═══════════════════════════════════════
   BODY — main split
═══════════════════════════════════════ */
.body{
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
}

/* ═══════════════════════════════════════
   SCIENCE PANEL — desktop left column
═══════════════════════════════════════ */
.sci{
  width:240px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--line);
  min-height:0;
  overflow:hidden;
}
.sci-head{
  display:flex;align-items:center;gap:6px;
  padding:10px 12px 8px;
  flex-shrink:0;
  flex-wrap:wrap;
  gap:5px;
  border-bottom:1px solid var(--line);
}
.cat-btn{
  background:none;border:1px solid var(--line);border-radius:4px;
  font-family:var(--ff);font-size:10px;font-weight:600;letter-spacing:.08em;
  color:var(--t3);padding:3px 9px;cursor:pointer;
  transition:background .1s,color .1s,border-color .1s;text-transform:uppercase;
}
.cat-btn.on{background:var(--btn-op);border-color:var(--line2);color:var(--t1);}
.cat-btn:hover:not(.on){color:var(--t2);border-color:var(--line2);}

/* Sci button grid — fills remaining height */
.sci-grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:var(--line);
  gap:1px;
  overflow-y:auto;
  min-height:0;
}
.sci-grid::-webkit-scrollbar{width:2px;}
.sci-grid::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}

.sfn{
  background:var(--btn-fn);
  border:none;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;
  padding:8px 4px;
  min-height:50px;
  font-family:var(--ff);
  color:var(--t1);
  position:relative;overflow:hidden;
  transition:background .1s;
  touch-action:manipulation;
}
.sfn-main{font-size:14px;font-weight:500;line-height:1;}
.sfn-sub{font-size:9.5px;color:var(--t3);font-family:var(--fm);letter-spacing:.02em;}
.sfn:hover{background:var(--btn-util);}
.sfn:active{background:var(--btn-op);}

/* ═══════════════════════════════════════
   MAIN CALC — right side
═══════════════════════════════════════ */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden;
}

/* ═══════════════════════════════════════
   DISPLAY
═══════════════════════════════════════ */
.disp-wrap{
  flex-shrink:0;
  padding:16px 22px 14px;
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:clamp(100px,18vh,150px);
}
.disp-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
}
.disp-flags{display:flex;gap:5px;}
.flag{
  font-size:9px;font-weight:700;letter-spacing:.14em;
  color:var(--t4);border:1px solid var(--line);border-radius:3px;
  padding:2px 6px;text-transform:uppercase;
  transition:color .15s,border-color .15s;
}
.flag.on{color:var(--t2);border-color:var(--line2);}
.disp-mode{font-size:9px;font-weight:700;letter-spacing:.18em;color:var(--t3);text-transform:uppercase;}
.disp-expr{
  font-family:var(--fm);font-size:13px;color:var(--t2);
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-height:18px;margin-bottom:4px;
}
.disp-main{
  font-family:var(--fm);
  font-size:clamp(32px,5.5vw,54px);
  font-weight:300;color:var(--t1);
  text-align:right;line-height:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .15s,font-size .1s;
}
.disp-main.sm{font-size:clamp(22px,3.8vw,38px)!important;}
.disp-main.xs{font-size:clamp(16px,2.8vw,26px)!important;}
.disp-main.err{color:var(--err)!important;}
@keyframes blink{0%,100%{opacity:1}40%{opacity:.18}}
.disp-main.blink{animation:blink .22s ease;}

/* ═══════════════════════════════════════
   BUTTON GRID — fills ALL remaining height
   Desktop: 5 cols × 6 rows
   Mobile:  4 cols × 7 rows
═══════════════════════════════════════ */
.btn-grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(6,1fr);
  background:var(--line);
  gap:1px;
  min-height:0;
}

/* ── Button base ── */
.btn{
  background:var(--btn);
  border:none;
  color:var(--t1);
  font-family:var(--ff);
  font-size:clamp(14px,2vw,20px);
  font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  outline:none;
  transition:background .08s;
  touch-action:manipulation;
  line-height:1;
  padding:0;
}
/* Press feel */
.btn:active{background:var(--btn-util)!important;}
.btn.kbd{background:var(--btn-util)!important;}

/* Ripple */
.btn::after{
  content:'';position:absolute;border-radius:50%;
  background:rgba(255,255,255,.1);
  width:0;height:0;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;
}
.lm .btn::after{background:rgba(0,0,0,.07);}
.btn.rpl::after{
  width:250px;height:250px;
  transform:translate(-50%,-50%) scale(1);opacity:0;
  transition:width .5s ease,height .5s ease,opacity .5s ease;
}
.btn:hover:not(.eq){background:var(--btn-util);}

/* Variants */
.op{background:var(--btn-op);font-size:clamp(18px,2.5vw,26px);font-weight:300;}
.op:hover{background:var(--btn-util);}
.ut{background:var(--btn-util);color:var(--t2);font-size:clamp(12px,1.5vw,16px);font-weight:600;letter-spacing:.04em;}
.ut:hover{color:var(--t1);background:var(--btn-op);}
.ut:active{background:var(--btn-op)!important;}
.clr{background:var(--btn-util);color:var(--t1);font-size:clamp(13px,1.6vw,18px);font-weight:700;}
.eq{
  background:var(--btn-eq);color:var(--eq-txt);
  font-size:clamp(22px,3vw,36px);font-weight:300;
  grid-row:span 2;
  transition:filter .1s;
}
.eq:hover{filter:brightness(.92);}
.eq:active{filter:brightness(.82)!important;}
.eq.blink-eq{animation:blink .22s ease;}
.w2{grid-column:span 2;}

/* ═══════════════════════════════════════
   MOBILE SCIENCE DRAWER
═══════════════════════════════════════ */
.mob-drawer{
  display:none;
  position:absolute;bottom:0;left:0;right:0;z-index:20;
  background:var(--bg);
  border-top:1px solid var(--line2);
  border-radius:14px 14px 0 0;
  flex-direction:column;
  max-height:72dvh;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  overflow:hidden;
}
.mob-drawer.open{transform:translateY(0);}
.mob-drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 8px;flex-shrink:0;
}
.mob-drawer-label{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--t3);text-transform:uppercase;}
.mob-drawer-close{
  background:none;border:none;cursor:pointer;color:var(--t2);
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:6px;
}
.mob-drawer-close svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.mob-cat-row{
  display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;
  padding:0 14px 10px;flex-shrink:0;
}
.mob-cat-row::-webkit-scrollbar{display:none;}
.mob-cat-btn{
  background:none;border:1px solid var(--line);border-radius:4px;
  font-family:var(--ff);font-size:10px;font-weight:600;letter-spacing:.08em;
  color:var(--t3);padding:4px 11px;cursor:pointer;white-space:nowrap;
  transition:background .1s,color .1s,border-color .1s;text-transform:uppercase;
}
.mob-cat-btn.on{background:var(--btn-op);border-color:var(--line2);color:var(--t1);}
.mob-angle-row{
  padding:0 14px 10px;flex-shrink:0;
}
.mob-sci-grid{
  flex:1;overflow-y:auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--line);gap:1px;
}
.mob-sci-grid::-webkit-scrollbar{width:2px;}
.mob-sfn{
  background:var(--btn-fn);border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:14px 4px;min-height:58px;
  font-family:var(--ff);color:var(--t1);
  position:relative;overflow:hidden;
  transition:background .1s;touch-action:manipulation;
}
.mob-sfn-main{font-size:16px;font-weight:500;line-height:1;}
.mob-sfn-sub{font-size:9px;color:var(--t3);font-family:var(--fm);}
.mob-sfn:active{background:var(--btn-op);}

/* Mobile sci trigger */
.mob-sci-bar{
  display:none;
  flex-shrink:0;
  border-top:1px solid var(--line);
  padding:8px 10px 6px;
}
.mob-sci-btn{
  width:100%;background:var(--btn-util);border:1px solid var(--line2);border-radius:8px;
  font-family:var(--ff);font-size:12px;font-weight:600;letter-spacing:.1em;
  color:var(--t2);text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;transition:background .12s,color .12s;
}
.mob-sci-btn:hover{color:var(--t1);background:var(--btn-op);}
.mob-sci-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}

/* ═══════════════════════════════════════
   HISTORY PANEL
═══════════════════════════════════════ */
.hist{
  position:absolute;inset:0;z-index:30;
  background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  overflow:hidden;
}
.hist.open{transform:translateX(0);}
.hist-head{
  display:flex;align-items:center;gap:10px;
  height:50px;padding:0 16px;
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.hist-back{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  background:var(--btn-util);border:1px solid var(--line2);
  cursor:pointer;color:var(--t1);flex-shrink:0;
  transition:background .12s;
}
.hist-back:hover{background:var(--btn-op);}
.hist-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hist-title{font-size:15px;font-weight:600;color:var(--t1);flex:1;}
.hist-clr{
  background:none;border:none;cursor:pointer;
  font-family:var(--ff);font-size:11px;font-weight:600;letter-spacing:.1em;
  color:var(--t3);padding:5px 10px;border-radius:4px;
  text-transform:uppercase;transition:color .12s,background .12s;
}
.hist-clr:hover{color:var(--t2);background:var(--btn-util);}
.hist-list{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
  padding:10px 16px;
}
.hist-list::-webkit-scrollbar{width:2px;}
.hist-list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}
.hitem{
  padding:12px 14px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:background .1s,border-color .1s;
}
.hitem:hover{background:var(--btn-util);border-color:var(--line);}
.hitem-expr{font-family:var(--fm);font-size:12px;color:var(--t2);margin-bottom:4px;}
.hitem-res{font-family:var(--fm);font-size:24px;font-weight:300;color:var(--t1);}
.hist-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.hist-empty svg{width:36px;height:36px;stroke:var(--t3);fill:none;stroke-width:1.3;stroke-linecap:round;}
.hist-empty-txt{font-size:12px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;}

/* ═══════════════════════════════════════
   RESPONSIVE BREAKPOINTS
═══════════════════════════════════════ */
/* Desktop ≥ 720px: show sci panel */
@media(min-width:720px){
  .sci             { display:flex; }
  .mob-sci-bar     { display:none!important; }
  .mob-drawer      { display:none!important; }
  .btn-grid        { grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(6,1fr); }
  /* On desktop, hide the .mob-only class buttons */
  .mob-only        { display:none!important; }
}

/* Mobile < 720px: hide sci panel */
@media(max-width:719px){
  .sci             { display:none!important; }
  .mob-sci-bar     { display:flex; }
  .mob-drawer      { display:flex; }
  #app             { position:relative; }
  .btn-grid        { grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(7,1fr); }
  /* Hide desktop-only col5 buttons */
  .desk-only       { display:none!important; }
  /* Show mob-only buttons */
  .mob-only        { display:flex!important; }
  .disp-wrap       { min-height:clamp(90px,16dvh,130px); padding:12px 16px 10px; }
  .disp-main       { font-size:clamp(30px,9vw,50px)!important; }
  .disp-main.sm    { font-size:clamp(22px,7vw,38px)!important; }
  .bar             { padding:0 12px; }
  /* On mobile, angle pill goes in drawer */
  .bar .angle-pill { display:none; }
}
@media(max-width:380px){
  .btn{font-size:14px;}
  .op{font-size:20px;}
}
/* Short screens */
@media(max-height:620px) and (min-width:720px){
  .disp-wrap{min-height:90px;padding:10px 20px 10px;}
  .disp-main{font-size:36px!important;}
  .bar{height:40px;}
  .sfn{min-height:42px;padding:6px 4px;}
  .sfn-main{font-size:12px;}
}
</style>
</head>
<body>

<div id="app">

  <!-- ═══ TOP BAR ═══ -->
  <div class="bar">
    <span class="bar-brand">Calc</span>
    <div class="bar-space"></div>
    <!-- Angle mode — desktop -->
    <div class="angle-pill" id="desktopAnglePill">
      <button class="apill-btn on" onclick="setAngle('deg')">DEG</button>
      <button class="apill-btn"    onclick="setAngle('rad')">RAD</button>
      <button class="apill-btn"    onclick="setAngle('grad')">GRAD</button>
    </div>
    <button class="ib" id="histBtn" title="History">
      <svg viewBox="0 0 24 24"><path d="M3 3v6h6"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 15"/></svg>
    </button>
    <button class="ib" id="themeBtn">
      <svg id="iMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iSun"  viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <!-- ═══ BODY ═══ -->
  <div class="body">

    <!-- ── SCIENCE PANEL (desktop only) ── -->
    <div class="sci" id="sciPanel">
      <div class="sci-head" id="sciHead">
        <button class="cat-btn on" data-cat="trig">Trig</button>
        <button class="cat-btn" data-cat="hyp">Hyp</button>
        <button class="cat-btn" data-cat="power">Power</button>
        <button class="cat-btn" data-cat="log">Log</button>
        <button class="cat-btn" data-cat="const">Const</button>
        <button class="cat-btn" data-cat="misc">Misc</button>
      </div>
      <div class="sci-grid" id="sciGrid"></div>
    </div>

    <!-- ── MAIN PANEL ── -->
    <div class="main">

      <!-- Display -->
      <div class="disp-wrap">
        <div class="disp-top">
          <span class="disp-mode" id="modeLabel">DEG</span>
          <div class="disp-flags">
            <span class="flag" id="fM">M</span>
            <span class="flag" id="fAns">ANS</span>
          </div>
        </div>
        <div class="disp-expr" id="exprLine">&nbsp;</div>
        <div class="disp-main" id="mainDisp">0</div>
      </div>

      <!-- Mobile science trigger -->
      <div class="mob-sci-bar">
        <button class="mob-sci-btn" id="mobSciTrigger">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          Functions
          <svg viewBox="0 0 24 24" id="sciArrow"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
      </div>

      <!--
        DESKTOP GRID — 5 cols × 6 rows
        ┌────┬────┬────┬────┬────┐
        │ MC │ MR │ M+ │ M- │ MS │  row 1
        ├────┼────┼────┼────┼────┤
        │ AC │ (  │ )  │ ⌫  │ %  │  row 2
        ├────┼────┼────┼────┼────┤
        │  7 │  8 │  9 │  ÷ │  × │  row 3
        ├────┼────┼────┼────┼────┤

<script>
/* ══════════════════════════════════════════
   AUDIO
══════════════════════════════════════════ */
let _AC;
const getAC=()=>{if(!_AC)try{_AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};return _AC};
const beep=(f=900,d=.04,v=.034)=>{try{
  const c=getAC();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  o.start();o.stop(c.currentTime+d+.01);
}catch(e){}};
const sfx={
  tap:()=>beep(960,.03,.032),
  eq:()=>beep(660,.09,.046),
  err:()=>beep(180,.14,.05),
  fn:()=>beep(1080,.05,.036),
  mem:()=>beep(1180,.055,.038),
  clr:()=>beep(700,.06,.04),
  thm:()=>beep(1350,.04,.03),
  op:()=>beep(820,.03,.03),
};

/* ══════════════════════════════════════════
   SCIENCE DATA
══════════════════════════════════════════ */
const SCI={
  trig:[
    {m:'sin', s:'',    a:'fn',v:'sin'},
    {m:'cos', s:'',    a:'fn',v:'cos'},
    {m:'tan', s:'',    a:'fn',v:'tan'},
    {m:'sin⁻¹',s:'asin',a:'fn',v:'asin'},
    {m:'cos⁻¹',s:'acos',a:'fn',v:'acos'},
    {m:'tan⁻¹',s:'atan',a:'fn',v:'atan'},
    {m:'sec', s:'1/cos',a:'fn',v:'sec'},
    {m:'csc', s:'1/sin',a:'fn',v:'csc'},
    {m:'cot', s:'1/tan',a:'fn',v:'cot'},
  ],
  hyp:[
    {m:'sinh', s:'',a:'fn',v:'sinh'},
    {m:'cosh', s:'',a:'fn',v:'cosh'},
    {m:'tanh', s:'',a:'fn',v:'tanh'},
    {m:'sinh⁻¹',s:'asinh',a:'fn',v:'asinh'},
    {m:'cosh⁻¹',s:'acosh',a:'fn',v:'acosh'},
    {m:'tanh⁻¹',s:'atanh',a:'fn',v:'atanh'},
  ],
  power:[
    {m:'x²',   s:'square',  a:'fn',v:'sq'},
    {m:'x³',   s:'cube',    a:'fn',v:'cube'},
    {m:'xʸ',   s:'power',   a:'fn',v:'pow'},
    {m:'√x',   s:'sqrt',    a:'fn',v:'sqrt'},
    {m:'∛x',   s:'cbrt',    a:'fn',v:'cbrt'},
    {m:'ⁿ√x',  s:'nth root',a:'fn',v:'nrt'},
    {m:'1/x',  s:'reciprocal',a:'fn',v:'inv'},
    {m:'|x|',  s:'absolute',a:'fn',v:'abs'},
    {m:'x!',   s:'factorial',a:'fn',v:'fact'},
  ],
  log:[
    {m:'log',  s:'base 10', a:'fn',v:'log'},
    {m:'ln',   s:'natural', a:'fn',v:'ln'},
    {m:'log₂', s:'base 2',  a:'fn',v:'log2'},
    {m:'10ˣ',  s:'pow 10',  a:'fn',v:'10x'},
    {m:'eˣ',   s:'exp',     a:'fn',v:'ex'},
    {m:'2ˣ',   s:'pow 2',   a:'fn',v:'2x'},
  ],
  const:[
    {m:'π', s:'3.14159…',a:'const',v:String(Math.PI)},
    {m:'e', s:'2.71828…',a:'const',v:String(Math.E)},
    {m:'φ', s:'1.61803…',a:'const',v:String((1+Math.sqrt(5))/2)},
    {m:'√2',s:'1.41421…',a:'const',v:String(Math.SQRT2)},
    {m:'τ', s:'2π',      a:'const',v:String(2*Math.PI)},
    {m:'Ans',s:'last =', a:'ans'},
    {m:'c', s:'299792458',a:'const',v:'299792458'},
    {m:'g', s:'9.80665', a:'const',v:'9.80665'},
  ],
  misc:[
    {m:'%',    s:'percent',  a:'fn',v:'pct'},
    {m:'±',    s:'negate',   a:'fn',v:'pm'},
    {m:'⌊x⌋',  s:'floor',    a:'fn',v:'floor'},
    {m:'⌈x⌉',  s:'ceil',     a:'fn',v:'ceil'},
    {m:'round',s:'nearest',  a:'fn',v:'round'},
    {m:'mod',  s:'remainder',a:'fn',v:'mod'},
    {m:'nPr',  s:'permutation',a:'fn',v:'npr'},
    {m:'nCr',  s:'combination',a:'fn',v:'ncr'},
    {m:'rand', s:'0–1',      a:'fn',v:'rand'},
  ],
};

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
const S={
  expr:'', result:'0', mem:0, ans:0,
  angle:'deg', fresh:false, paren:0, isLight:false,
  hist:(()=>{try{return JSON.parse(localStorage.getItem('_ch')||'[]')}catch(e){return[]}})(),
};

/* ══════════════════════════════════════════
   DOM REFS
══════════════════════════════════════════ */
const D  =document.getElementById('mainDisp');
const EL =document.getElementById('exprLine');
const ML =document.getElementById('modeLabel');
const FM =document.getElementById('fM');
const FA =document.getElementById('fAns');
const HP =document.getElementById('histPanel');
const HL =document.getElementById('histList');
const MD =document.getElementById('mobDrawer');
const MSG=document.getElementById('mobSciGrid');
const SG =document.getElementById('sciGrid');

/* ══════════════════════════════════════════
   DISPLAY
══════════════════════════════════════════ */
function setD(val,expr){
  const s=String(val);
  D.textContent=s;D.classList.remove('err');
  D.classList.toggle('sm',s.length>13);
  D.classList.toggle('xs',s.length>19);
  if(expr!==undefined) EL.textContent=expr||'\u00a0';
}
function errD(msg='Error'){
  D.textContent=msg;D.classList.add('err','blink');
  EL.textContent=S.expr||'\u00a0';
  setTimeout(()=>D.classList.remove('blink'),260);sfx.err();
}
function blinkD(){D.classList.add('blink');setTimeout(()=>D.classList.remove('blink'),240);}

/* ══════════════════════════════════════════
   FORMATTING
══════════════════════════════════════════ */
function fmt(n){
  if(!isFinite(n))return isNaN(n)?'Error':n>0?'∞':'-∞';
  if(n===0)return'0';
  const abs=Math.abs(n);
  if(abs>=1e15||(abs<1e-10&&abs!==0))return n.toExponential(8).replace(/\.?0+e/,'e');
  return String(parseFloat(n.toPrecision(12)));
}

/* ══════════════════════════════════════════
   ANGLE
══════════════════════════════════════════ */
function toRad(x){
  if(S.angle==='rad')return x;
  if(S.angle==='grad')return x*Math.PI/200;
  return x*Math.PI/180;
}
function fromRad(x){
  if(S.angle==='rad')return x;
  if(S.angle==='grad')return x*200/Math.PI;
  return x*180/Math.PI;
}
function setAngle(m){
  S.angle=m;ML.textContent=m.toUpperCase();
  document.querySelectorAll('.apill-btn').forEach(b=>{
    b.classList.toggle('on',b.textContent.toLowerCase()===m);
  });
  sfx.tap();
}
window.setAngle=setAngle;

/* ══════════════════════════════════════════
   EVAL
══════════════════════════════════════════ */
const OPS=['+','−','×','÷'];
function evalE(s){
  const js=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  try{return+new Function('"use strict";return('+js+')')()}catch(e){return NaN}
}
function lastN(){const m=S.expr.match(/[-\d.]+$/);return m?parseFloat(m[0]):NaN;}
function factorial(n){
  n=Math.round(n);if(n<0||n>170)return NaN;
  let r=1;for(let i=2;i<=n;i++)r*=i;return r;
}

/* ══════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════ */
function doN(v){
  if(S.fresh){S.expr='';S.fresh=false;}
  if(S.expr.slice(-1)===')') return;
  if(!S.expr||S.expr==='0')S.expr=v;
  else if(S.expr==='-0')S.expr='-'+v;
  else S.expr+=v;
  const n=lastN();S.result=isNaN(n)?v:fmt(n);
  setD(S.result,S.expr);
}
function doDot(){
  if(S.fresh){S.expr='0.';S.result='0.';S.fresh=false;setD('0.','0.');return;}
  const m=S.expr.match(/[\d.]+$/);
  if(m&&m[0].includes('.'))return;
  if(!S.expr||OPS.some(o=>S.expr.endsWith(o))||S.expr.endsWith('('))S.expr+='0';
  S.expr+='.';S.result=(S.expr.match(/[\d.]+$/)||['.'])[0];
  setD(S.result,S.expr);
}
function doOp(op){
  if(S.fresh)S.fresh=false;
  if(!S.expr){S.expr='0'+op;setD('0',S.expr);return;}
  const last=S.expr.slice(-1);
  if(OPS.includes(last))S.expr=S.expr.slice(0,-1)+op;
  else S.expr+=op;
  setD(S.result,S.expr);sfx.op();
}
function doEq(){
  if(!S.expr||S.expr==='0')return;
  let e=S.expr;
  for(let i=0;i<S.paren;i++)e+=')';S.paren=0;
  if(OPS.some(o=>e.endsWith(o)))e=e.slice(0,-1);
  const r=evalE(e);
  if(!isFinite(r)&&!isNaN(r)){
    const m=r>0?'∞':'-∞';setD(m,e+' =');S.result=m;S.expr=m;S.fresh=true;
  }else if(isNaN(r)){errD('Error');S.expr='';S.result='0';}
  else{
    const f=fmt(r);S.ans=r;FA.classList.add('on');
    saveHist(e,f);setD(f,e+' =');blinkD();sfx.eq();
    S.result=f;S.expr=f;S.fresh=true;
  }
}
function doClr(){S.expr='';S.result='0';S.fresh=false;S.paren=0;D.classList.remove('err');setD('0','\u00a0');sfx.clr();}
function doBk(){
  if(S.fresh||!S.expr){doClr();return;}
  S.expr=S.expr.slice(0,-1);
  if(!S.expr){S.result='0';setD('0','\u00a0');return;}
  const n=lastN();S.result=isNaN(n)?S.result:fmt(n);setD(S.result,S.expr);
}
function doPO(){
  if(S.fresh){S.expr='';S.fresh=false;}
  const last=S.expr.slice(-1);
  if(/\d/.test(last)||last===')')S.expr+='×';
  S.expr+='(';S.paren++;setD(S.result,S.expr);
}
function doPC(){
  if(S.paren<=0)return;
  S.expr+=')';S.paren--;
  const r=evalE(S.expr);
  if(!isNaN(r)&&isFinite(r))S.result=fmt(r);
  setD(S.result,S.expr);
}
function doEE(){if(S.fresh)S.fresh=false;S.expr+='×10^';setD(S.result,S.expr);}
function doFn(fn){
  const cur=S.fresh?parseFloat(S.result):lastN();
  const c=isNaN(cur)?0:cur;
  let r,lbl;
  switch(fn){
    case 'sin':  r=Math.sin(toRad(c));lbl=`sin(${c})`;break;
    case 'cos':  r=Math.cos(toRad(c));lbl=`cos(${c})`;break;
    case 'tan':
      if(S.angle==='deg'&&Math.abs((c%180)-90)<1e-9){errD('Undefined');return;}
      r=Math.tan(toRad(c));lbl=`tan(${c})`;break;
    case 'asin':
      if(c<-1||c>1){errD('Domain Err');return;}
      r=fromRad(Math.asin(c));lbl=`sin⁻¹(${c})`;break;
    case 'acos':
      if(c<-1||c>1){errD('Domain Err');return;}
      r=fromRad(Math.acos(c));lbl=`cos⁻¹(${c})`;break;
    case 'atan': r=fromRad(Math.atan(c));lbl=`tan⁻¹(${c})`;break;
    case 'sec':  r=1/Math.cos(toRad(c));lbl=`sec(${c})`;break;
    case 'csc':  r=1/Math.sin(toRad(c));lbl=`csc(${c})`;break;
    case 'cot':  r=1/Math.tan(toRad(c));lbl=`cot(${c})`;break;
    case 'sinh': r=Math.sinh(c);lbl=`sinh(${c})`;break;
    case 'cosh': r=Math.cosh(c);lbl=`cosh(${c})`;break;
    case 'tanh': r=Math.tanh(c);lbl=`tanh(${c})`;break;
    case 'asinh':r=Math.asinh(c);lbl=`sinh⁻¹(${c})`;break;
    case 'acosh':if(c<1){errD('Domain Err');return;}r=Math.acosh(c);lbl=`cosh⁻¹(${c})`;break;
    case 'atanh':if(c<=-1||c>=1){errD('Domain Err');return;}r=Math.atanh(c);lbl=`tanh⁻¹(${c})`;break;
    case 'log':  if(c<=0){errD('Domain Err');return;}r=Math.log10(c);lbl=`log(${c})`;break;
    case 'ln':   if(c<=0){errD('Domain Err');return;}r=Math.log(c);lbl=`ln(${c})`;break;
    case 'log2': if(c<=0){errD('Domain Err');return;}r=Math.log2(c);lbl=`log₂(${c})`;break;
    case '10x':  r=Math.pow(10,c);lbl=`10^${c}`;break;
    case 'ex':   r=Math.exp(c);lbl=`e^${c}`;break;
    case '2x':   r=Math.pow(2,c);lbl=`2^${c}`;break;
    case 'sq':   r=c*c;lbl=`(${c})²`;break;
    case 'cube': r=c*c*c;lbl=`(${c})³`;break;
    case 'sqrt': if(c<0){errD('Domain Err');return;}r=Math.sqrt(c);lbl=`√(${c})`;break;
    case 'cbrt': r=Math.cbrt(c);lbl=`∛(${c})`;break;
    case 'nrt':  S.expr=S.expr.replace(/[-\d.]+$/,'')+'('+c+')**(1/';S.fresh=false;setD(fmt(c),S.expr);return;
    case 'pow':  S.expr=S.expr.replace(/[-\d.]+$/,'')+'('+c+')**';S.fresh=false;setD(fmt(c),S.expr);return;
    case 'inv':  if(c===0){errD('Div by 0');return;}r=1/c;lbl=`1/(${c})`;break;
    case 'abs':  r=Math.abs(c);lbl=`|${c}|`;break;
    case 'fact': if(c<0||c>170||!Number.isInteger(c)){errD('Domain Err');return;}r=factorial(c);lbl=`${c}!`;break;
    case 'floor':r=Math.floor(c);lbl=`⌊${c}⌋`;break;
    case 'ceil': r=Math.ceil(c);lbl=`⌈${c}⌉`;break;
    case 'round':r=Math.round(c);lbl=`round(${c})`;break;
    case 'pm':   r=-c;lbl=`-(${c})`;break;
    case 'pct':  r=c/100;lbl=`${c}%`;break;
    case 'mod':  S.expr=S.expr.replace(/[-\d.]+$/,'')+'('+c+')%';S.fresh=false;setD(fmt(c),S.expr);return;
    case 'npr':  S.expr=S.expr.replace(/[-\d.]+$/,'')+'nPr('+c+',';S.fresh=false;setD(fmt(c),S.expr);return;
    case 'ncr':  S.expr=S.expr.replace(/[-\d.]+$/,'')+'nCr('+c+',';S.fresh=false;setD(fmt(c),S.expr);return;
    case 'rand': r=Math.random();lbl='rand()';break;
    default: return;
  }
  if(r===undefined||isNaN(r)){errD('Error');return;}
  if(!isFinite(r)){const m=r>0?'∞':'-∞';S.result=m;S.expr=m;S.fresh=true;setD(m,lbl);return;}
  const f=fmt(r);S.result=f;S.expr=f;S.fresh=true;setD(f,lbl);sfx.fn();
}
function doConst(v){
  if(S.fresh){S.expr='';S.fresh=false;}
  const last=S.expr.slice(-1);
  if(/\d/.test(last)||last===')')S.expr+='×';
  S.expr+=v;S.result=fmt(parseFloat(v));setD(S.result,S.expr);sfx.fn();
}
function doAns(){
  if(S.fresh){S.expr='';S.fresh=false;}
  const f=fmt(S.ans);S.expr+=f;S.result=f;setD(f,S.expr);sfx.tap();
}
function doMem(op){
  const cur=parseFloat(S.result)||0;
  if(op==='mc')S.mem=0;
  else if(op==='mr'){const f=fmt(S.mem);S.expr=f;S.result=f;S.fresh=true;setD(f,f);}
  else if(op==='mp')S.mem+=cur;
  else if(op==='mm')S.mem-=cur;
  else if(op==='ms')S.mem=cur;
  FM.classList.toggle('on',S.mem!==0);sfx.mem();
}
function doPct(){doFn('pct');}
function doPm(){doFn('pm');}

/* ══════════════════════════════════════════
   DISPATCH
══════════════════════════════════════════ */
const A={
  n:doN,dot:doDot,op:doOp,eq:doEq,clr:doClr,bk:doBk,
  po:doPO,pc:doPC,ee:doEE,pm:doPm,pct:doPct,
  mc:()=>doMem('mc'),mr:()=>doMem('mr'),mp:()=>doMem('mp'),
  mm:()=>doMem('mm'),ms:()=>doMem('ms'),
};
function dispatch(a,v,btn){
  sfx.tap();if(btn)ripple(btn);
  const fn=A[a];if(fn)fn(v);
}
function ripple(b){
  b.classList.remove('rpl');void b.offsetWidth;
  b.classList.add('rpl');setTimeout(()=>b.classList.remove('rpl'),550);
}

/* ══════════════════════════════════════════
   BASIC BUTTONS
══════════════════════════════════════════ */
document.querySelectorAll('#btnGrid .btn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();dispatch(b.dataset.a,b.dataset.v,b);
  });
});

/* ══════════════════════════════════════════
   SCIENCE GRID RENDER
══════════════════════════════════════════ */
let deskCat='trig', mobCat='trig';

function renderSci(cat,container,btnCls,subCls){
  container.innerHTML='';
  (SCI[cat]||[]).forEach(item=>{
    const b=document.createElement('button');
    b.className=btnCls;
    const main=document.createElement('span');
    main.className=btnCls.includes('mob')?'mob-sfn-main':'sfn-main';
    main.textContent=item.m;
    b.appendChild(main);
    if(item.s){
      const sub=document.createElement('span');
      sub.className=btnCls.includes('mob')?'mob-sfn-sub':'sfn-sub';
      sub.textContent=item.s;
      b.appendChild(sub);
    }
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();sfx.fn();ripple(b);
      if(item.a==='fn')doFn(item.v);
      else if(item.a==='const')doConst(item.v);
      else if(item.a==='ans')doAns();
    });
    container.appendChild(b);
  });
}

document.getElementById('sciHead').addEventListener('click',e=>{
  const btn=e.target.closest('.cat-btn');if(!btn)return;
  deskCat=btn.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('on',b===btn));
  renderSci(deskCat,SG,'sfn','sfn-sub');
});
document.getElementById('mobCatRow').addEventListener('click',e=>{
  const btn=e.target.closest('.mob-cat-btn');if(!btn)return;
  mobCat=btn.dataset.cat;
  document.querySelectorAll('.mob-cat-btn').forEach(b=>b.classList.toggle('on',b===btn));
  renderSci(mobCat,MSG,'mob-sfn','mob-sfn-sub');
});

renderSci('trig',SG,'sfn','sfn-sub');
renderSci('trig',MSG,'mob-sfn','mob-sfn-sub');

/* ══════════════════════════════════════════
   HISTORY
══════════════════════════════════════════ */
function saveHist(e,r){
  S.hist.unshift({e,r});if(S.hist.length>80)S.hist.pop();
  try{localStorage.setItem('_ch',JSON.stringify(S.hist))}catch(ex){}
  if(HP.classList.contains('open'))renderHist();
}
function renderHist(){
  HL.innerHTML='';
  if(!S.hist.length){
    HL.innerHTML=`<div class="hist-empty">
      <svg viewBox="0 0 24 24"><path d="M3 3v6h6"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 15"/></svg>
      <span class="hist-empty-txt">No history yet</span>
    </div>`;
    return;
  }
  S.hist.forEach(item=>{
    const el=document.createElement('div');
    el.className='hitem';
    el.innerHTML=`<div class="hitem-expr">${item.e} =</div><div class="hitem-res">${item.r}</div>`;
    el.addEventListener('click',()=>{
      S.expr=item.r;S.result=item.r;S.fresh=true;setD(item.r);closeHist();
    });
    HL.appendChild(el);
  });
}
function openHist(){renderHist();HP.classList.add('open');}
function closeHist(){HP.classList.remove('open');}

document.getElementById('histBtn').addEventListener('click',()=>HP.classList.contains('open')?closeHist():openHist());
document.getElementById('histBack').addEventListener('click',closeHist);
document.getElementById('histClr').addEventListener('click',()=>{
  S.hist=[];try{localStorage.removeItem('_ch')}catch(e){}renderHist();
});

/* ══════════════════════════════════════════
   MOBILE DRAWER
══════════════════════════════════════════ */
const mobTrigger=document.getElementById('mobSciTrigger');
const sciArrow=document.getElementById('sciArrow');
function openDrawer(){MD.classList.add('open');sciArrow.style.transform='rotate(180deg)';}
function closeDrawer(){MD.classList.remove('open');sciArrow.style.transform='';}
mobTrigger.addEventListener('click',()=>MD.classList.contains('open')?closeDrawer():openDrawer());
document.getElementById('mobClose').addEventListener('click',closeDrawer);
let _ty=0;
MD.addEventListener('touchstart',e=>{_ty=e.touches[0].clientY},{passive:true});
MD.addEventListener('touchmove',e=>{if(e.touches[0].clientY-_ty>80)closeDrawer()},{passive:true});

/* ══════════════════════════════════════════
   MOBILE LAYOUT — show/hide correct buttons
══════════════════════════════════════════ */
function applyLayout(){
  const mob=window.innerWidth<720;
  document.querySelectorAll('.mob-only').forEach(b=>{b.style.display=mob?'flex':'none';});
  document.querySelectorAll('.desk-only').forEach(b=>{b.style.display=mob?'none':'flex';});
}
applyLayout();
window.addEventListener('resize',applyLayout);

/* ══════════════════════════════════════════
   THEME
══════════════════════════════════════════ */
document.getElementById('themeBtn').addEventListener('click',()=>{
  S.isLight=!S.isLight;
  document.documentElement.classList.toggle('lm',S.isLight);
  document.body.classList.toggle('lm',S.isLight);
  document.getElementById('iMoon').style.display=S.isLight?'none':'block';
  document.getElementById('iSun').style.display=S.isLight?'block':'none';
  sfx.thm();
});

/* ══════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════ */
const KM={
  '0':['n','0'],'1':['n','1'],'2':['n','2'],'3':['n','3'],'4':['n','4'],
  '5':['n','5'],'6':['n','6'],'7':['n','7'],'8':['n','8'],'9':['n','9'],
  '.':['dot'],',':['dot'],
  '+':['op','+'],'-':['op','−'],'*':['op','×'],'/':['op','÷'],
  'Enter':['eq'],'=':['eq'],
  'Backspace':['bk'],'Delete':['clr'],'Escape':['_esc'],
  '(':['po'],')':['pc'],
  'h':['_hist'],'H':['_hist'],
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const m=KM[e.key];if(!m)return;
  e.preventDefault();
  if(m[0]==='_esc'){
    if(HP.classList.contains('open'))closeHist();
    else if(MD.classList.contains('open'))closeDrawer();
    else doClr();
    return;
  }
  if(m[0]==='_hist'){openHist();return;}
  let sel=`[data-a="${m[0]}"]`;
  if(m[1])sel=`[data-a="${m[0]}"][data-v="${m[1]}"]`;
  const btn=document.querySelector(sel);
  if(btn&&btn.offsetParent!==null){
    btn.classList.add('kbd');setTimeout(()=>btn.classList.remove('kbd'),130);ripple(btn);
  }
  dispatch(m[0],m[1]);
});

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
setD('0','\u00a0');
</script>
